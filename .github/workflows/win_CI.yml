name: Windows xSchedule CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout xSchedule
      uses: actions/checkout@v4
      with:
          submodules: 'true'
    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v3

    - name: Build xSchedule
      working-directory: xSchedule
      run: msbuild /m:10 xSchedule.sln /p:Configuration="Release" -p:Platform="x64"

    - name: Upload xSchedule Exe
      uses: actions/upload-artifact@v4
      with:
        name: xSchedule_Exe
        path: 'xSchedule\x64\Release\xSchedule.exe'
